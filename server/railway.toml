# Railway — deploy from the `server` root directory
# Dashboard: New Project → Deploy from GitHub → Root Directory = server
# Add a PostgreSQL plugin and link it so DATABASE_URL is injected.

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate"

[deploy]
startCommand = "npx prisma migrate deploy && node src/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
