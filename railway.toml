# Railway deploys the Express API + Prisma from this monorepo.
# Frontend (React) is deployed separately on Vercel — do not build the client here.

[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix server && npm run build --prefix server"

[deploy]
startCommand = "npm run start:railway --prefix server"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
